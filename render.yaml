services:
  - type: web
    name: vatsal-portfolio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
    disk:
      name: portfolio-data
      mountPath: /data
      sizeGB: 1
