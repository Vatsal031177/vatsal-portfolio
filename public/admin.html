<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Admin — Vatsal Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root { --red: #E50914; --bg: #0a0a0a; --bg-card: #141414; --text: #e5e5e5; --border: rgba(255,255,255,0.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
    #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: var(--bg-card); padding: 3rem; border: 1px solid var(--border); width: 350px; text-align: center; }
    input { width: 100%; background: #000; border: 1px solid var(--border); padding: 0.8rem; color: white; margin-bottom: 1rem; outline: none; }
    button { width: 100%; background: var(--red); color: white; border: none; padding: 0.8rem; cursor: pointer; font-weight: 700; }
    #admin-panel { display: none; padding: 50px; max-width: 1200px; margin: 0 auto; }
    .stat-card { background: var(--bg-card); padding: 2rem; border: 1px solid var(--border); margin-bottom: 2rem; }
    .msg-card { background: var(--bg-card); padding: 1.5rem; border: 1px solid var(--border); margin-bottom: 1rem; }
    .msg-header { display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--red); font-family: 'JetBrains Mono'; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h2 style="margin-bottom:2rem;color:var(--red)">ADMIN ACCESS</h2>
      <input type="password" id="pw" placeholder="Enter Password">
      <button onclick="login()">Login</button>
    </div>
  </div>

  <div id="admin-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3rem;">
      <h1>Portfolio Command Center</h1>
      <button onclick="logout()" style="width:auto; padding:0.5rem 1.5rem;">Logout</button>
    </div>
    
    <div class="stat-card">
      <p style="color:var(--text-dim)">Total Global Visits</p>
      <h2 id="total-visits" style="font-size:3rem">0</h2>
    </div>

    <h3 style="margin-bottom:1.5rem">Inbound Messages</h3>
    <div id="messages-list"></div>
  </div>

  <script>
    function login() {
      const pw = document.getElementById('pw').value;
      localStorage.setItem('admin_key', pw);
      loadDashboard();
    }
    function logout() { localStorage.removeItem('admin_key'); location.reload(); }

    async function loadDashboard() {
      const key = localStorage.getItem('admin_key');
      try {
        const res = await fetch('/api/admin/stats', { headers: { 'x-admin-key': key } });
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('total-visits').textContent = data.totalVisits;
        
        const list = document.getElementById('messages-list');
        list.innerHTML = data.messages.map(m => `
          <div class="msg-card">
            <div class="msg-header">
              <span>FROM: ${m.name} (${m.email})</span>
              <span>${new Date(m.created_at).toLocaleString()}</span>
            </div>
            <p><strong>${m.subject}</strong></p>
            <p style="margin-top:0.5rem; color:#aaa">${m.message}</p>
          </div>
        `).join('') || '<p>No messages yet.</p>';
      } catch (e) { alert('Access Denied'); }
    }
    if (localStorage.getItem('admin_key')) loadDashboard();
  </script>
</body>
</html>
